# deepscan signatures — leak / anomaly detectors.
#
# Each [[signature]] fires ONLY when its path exceeds baseline_mb, so it
# reports a *leak*, not just a big folder. Signatures are data: add a new
# [[signature]] block to teach deepscan a new leak. Community PRs welcome.
#
# Fields:
#   name         required  short title
#   path         required  dir to measure (supports ~, $VARS, * globs)
#   baseline_mb  required  healthy ceiling; fires above this
#   description  optional  one line
#   file_pattern optional  glob; counts matching files (evidence)
#   owner        optional  responsible daemon / bundle id
#   severity     optional  critical | warn | info (else inferred from ratio)
#   root_cause   optional  why it grows
#   prevention   optional  how to stop recurrence
#   safe_delete  optional  reclaim command (shown, never auto-run)

[[signature]]
name = "idleassetsd aerial wallpaper leak"
description = "Wallpaper/screensaver downloader hoarding partial 4K downloads"
path = "/private/var/folders/*/*/*/com.apple.idleassetsd"
file_pattern = "CFNetworkDownload_*.tmp"
owner = "com.apple.idleassetsd"
baseline_mb = 500
severity = "critical"
root_cause = "Aerial/dynamic wallpaper or screensaver re-downloading 4K assets that never finish"
prevention = "System Settings -> Wallpaper: pick a static image; Screen Saver: avoid Aerial videos"
safe_delete = "sudo rm -rf /private/var/folders/*/*/*/com.apple.idleassetsd   # partial downloads only; real wallpapers live in /Library/Application Support"

[[signature]]
name = "Xcode DerivedData bloat"
description = "Stale build intermediates and indexes across projects"
path = "~/Library/Developer/Xcode/DerivedData"
owner = "com.apple.dt.Xcode"
baseline_mb = 8000
severity = "warn"
root_cause = "Build output accumulates per project and is never auto-pruned"
prevention = "Xcode -> Settings -> Locations -> Derived Data; clear periodically"

[[signature]]
name = "Simulator runtime caches"
description = "CoreSimulator caches and stale downloaded runtimes"
path = "~/Library/Developer/CoreSimulator/Caches"
owner = "com.apple.CoreSimulator"
baseline_mb = 4000
severity = "warn"
root_cause = "Downloaded simulator runtime images and asset caches"
prevention = "xcrun simctl delete unavailable; remove unused runtimes"

[[signature]]
name = "User cache sprawl"
description = "~/Library/Caches grown unusually large"
path = "~/Library/Caches"
baseline_mb = 10000
severity = "info"
root_cause = "Per-app caches accumulating (browsers, build tools, media thumbnails)"
prevention = "Safe to clear; apps rebuild caches on next launch"

[[signature]]
name = "Docker.raw disk image bloat"
description = "Docker Desktop's virtual disk grows but never shrinks on its own"
path = "~/Library/Containers/com.docker.docker/Data/**/Docker.raw"
owner = "com.docker.docker"
baseline_mb = 20000
severity = "warn"
root_cause = "Image/container/volume layers accumulate; the sparse .raw file only ever grows"
prevention = "docker system prune -a --volumes; then Docker Desktop -> Troubleshoot -> Clean / Purge data to actually shrink the image"

[[signature]]
name = "iOS device backups"
description = "Local iPhone/iPad backups under MobileSync"
path = "~/Library/Application Support/MobileSync/Backup"
owner = "com.apple.AMPDevicesAgent"
baseline_mb = 5000
severity = "warn"
root_cause = "Each device backup is kept in full; old device backups are never pruned"
prevention = "Review in Finder -> device -> Manage Backups (these are real data — delete only stale ones)"

[[signature]]
name = "DocumentRevisions version store"
description = "Auto Save / Versions history at the volume root (needs sudo to read)"
path = "/.DocumentRevisions-V100"
owner = "com.apple.revisiond"
baseline_mb = 2000
severity = "warn"
root_cause = "revisiond keeps prior versions of auto-saved documents and rarely garbage-collects"
prevention = "sudo rm -rf /.DocumentRevisions-V100/* lets revisiond rebuild it (lose Versions history)"

[[signature]]
name = "QuickLook thumbnail cache"
description = "Finder/QuickLook preview thumbnail cache in the temp store"
path = "/private/var/folders/*/*/C/com.apple.QuickLook.thumbnailcache"
owner = "com.apple.quicklook"
baseline_mb = 1000
severity = "info"
root_cause = "Thumbnails for previewed files accumulate without bound"
prevention = "qlmanage -r cache  (rebuilds automatically)"

[[signature]]
name = "VM swap and sleepimage"
description = "Hibernation image plus swapfiles (needs sudo to read)"
path = "/private/var/vm"
owner = "kernel"
baseline_mb = 12000
severity = "info"
root_cause = "sleepimage equals installed RAM; swapfiles grow under memory pressure"
prevention = "Frees on reboot; on a desktop that never hibernates, sudo pmset hibernatemode 0 stops the sleepimage"

[[signature]]
name = "Simulator dyld caches"
description = "Per-runtime dyld shared caches for the iOS/watchOS/tvOS simulators"
path = "~/Library/Developer/CoreSimulator/Caches/dyld"
owner = "com.apple.CoreSimulator"
baseline_mb = 3000
severity = "info"
root_cause = "Each installed simulator runtime caches a multi-GB dyld shared cache"
prevention = "Safe to remove; regenerates when a simulator boots"

[[signature]]
name = "Downloaded simulator runtimes"
description = "Installed simulator runtime images (needs sudo to read)"
path = "/Library/Developer/CoreSimulator/Images"
owner = "com.apple.CoreSimulator"
baseline_mb = 8000
severity = "info"
root_cause = "Old simulator runtime images accumulate across Xcode versions"
prevention = "xcrun simctl runtime list; xcrun simctl runtime delete <id> for unused ones"

[[signature]]
name = "Homebrew download cache"
description = "Downloaded bottles and source tarballs"
path = "~/Library/Caches/Homebrew"
owner = "sh.brew"
baseline_mb = 3000
severity = "info"
root_cause = "Old formula downloads are kept after upgrades"
prevention = "brew cleanup --prune=all"

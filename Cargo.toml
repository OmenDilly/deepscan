[workspace]
resolver = "2"
members = ["crates/deepscan-core", "crates/deepscan-cli"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/OmenDilly/deepscan"

# A small, fast release binary — the "lightning fast" promise lives here.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

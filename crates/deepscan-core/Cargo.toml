[package]
name = "deepscan-core"
description = "Fast macOS disk forensics engine: parallel sizing + leak signatures"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
glob = "0.3"
shellexpand = "3"
anyhow = "1"

# macOS fast path: getattrlistbulk(2) — one syscall per directory.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

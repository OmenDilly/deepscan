[package]
name = "deepscan-cli"
description = "deepscan command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "deepscan"
path = "src/main.rs"

[dependencies]
deepscan-core = { path = "../deepscan-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ratatui = "0.29"
